name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  connected-source:
    name: Connected serving source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Extraction fixtures authenticate a historical packed implementation.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Historical source manifests pin Python 3.14.4's ast.dump format.
          # The existing product test job still uses Python 3.12.
          python-version: "3.14.4"

      - name: Check packaged inference and bridge contracts without native dependencies
        # These script entry points are outside pytest discovery. They check
        # source correspondence and stand-ins, not native serving or performance.
        run: |
          ulimit -v 1048576
          check_source_contract() {
            contract_log="$RUNNER_TEMP/connected-source-contract.log"
            if timeout 120 python -B -S "$@" > "$contract_log" 2>&1; then
              cat "$contract_log"
            else
              contract_status=$?
              cat "$contract_log"
              python - "$contract_log" <<'PY'
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(errors="replace")[-4096:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Connected source contract failure::" + text)
          PY
              return "$contract_status"
            fi
          }
          check_source_contract scripts/test_connected_inference_extraction.py
          check_source_contract scripts/test_connected_probe_inference_extraction.py
          check_source_contract scripts/test_connected_serving_inference.py
          check_source_contract scripts/test_connected_serving_factory.py
          check_source_contract scripts/test_connected_compact_serving.py
          check_source_contract scripts/test_connected_compact_serving.py --probe-only
          check_source_contract scripts/test_connected_artifact_identity.py
          check_source_contract scripts/test_connected_directory_handoff.py
          check_source_contract scripts/test_connected_installed_environment.py
          check_source_contract scripts/test_connected_installed_source_guard.py
          check_source_contract scripts/test_connected_gallery_provenance.py
          check_source_contract scripts/test_connected_gallery_conversion.py
          check_source_contract scripts/test_connected_gallery_fragment.py
          check_source_contract scripts/test_connected_serving_artifact.py
          check_source_contract scripts/test_connected_serving_admission.py

  test:
    name: Format, lint, type-check, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Include the `research` extra (torch, transformers, huggingface_hub)
        # so type-checking and tests run against the same environment as the
        # local pre-commit gate — without the ML deps installed, mypy can't find
        # their stubs and fails on modules that are only imported at runtime.
        # UV_TORCH_BACKEND=cpu selects the CPU torch wheels (the tests are
        # CPU-only) instead of the multi-GB default CUDA build.
        env:
          UV_TORCH_BACKEND: cpu
        run: uv sync --group dev --extra research

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest -q

      - name: Build reports
        run: |
          uv run --group dev sfora report-build \
            --output /tmp/sfora-report.md \
            --hf-card-output /tmp/sfora-hf.md
          uv run --group dev sfora report-site \
            --output /tmp/sfora-site/index.html
          test -s /tmp/sfora-report.md
          test -s /tmp/sfora-hf.md
          test -s /tmp/sfora-site/index.html

  site:
    name: Build Astro site + e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Astro requires Node >=22.12.0; 20 fails the build.
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        # Regenerates ../reports/site from source (catches Astro build errors); the
        # e2e step then serves and tests that fresh output.
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npx playwright test
